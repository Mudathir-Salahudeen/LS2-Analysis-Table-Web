<title>LS 2.0 Analysis Tables</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&display=swap">
<style>
/* Layout: page tabs, one filter panel, a toolbar, then one wide table in the same shape as the analysis sheet. */
:root {
  --bg: #f4f6f5; --surface: #ffffff; --fg: #16211f; --muted: #566562; --line: #d9e1df;
  --head: #eaf0ee; --head2: #dfe8e5; --total: #dcebe7; --accent: #0f6b63; --accent-ink: #ffffff; --hover: #f0f5f3;
  --scrim: rgba(10, 20, 18, 0.45);
  --font: "Public Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1514; --surface: #151d1c; --fg: #e5ecea; --muted: #97a7a3; --line: #283533;
    --head: #1b2625; --head2: #223130; --total: #1d3330; --accent: #52b8aa; --accent-ink: #082220; --hover: #1a2524;
    --scrim: rgba(0, 0, 0, 0.6); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f1514; --surface: #151d1c; --fg: #e5ecea; --muted: #97a7a3; --line: #283533;
  --head: #1b2625; --head2: #223130; --total: #1d3330; --accent: #52b8aa; --accent-ink: #082220; --hover: #1a2524;
  --scrim: rgba(0, 0, 0, 0.6); color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--fg); font-family: var(--font); font-size: 14px; line-height: 1.45;
  padding-block: 20px 56px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.shell { max-width: 1760px; margin: 0 auto; display: grid; grid-template-columns: 264px minmax(0, 1fr); gap: 20px; align-items: start; }
.main { display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.main > header { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 6px 16px; }
.side { position: sticky; top: 16px; max-height: calc(100vh - 32px); overflow: auto; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 14px 10px 12px; display: flex; flex-direction: column; gap: 12px; }
.brand { padding: 0 6px; }
.brand h1 { font-size: 17px; font-weight: 700; margin: 0; letter-spacing: -0.01em; }
.sub { color: var(--muted); font-size: 12.5px; margin-top: 2px; }
h1 { font-size: 22px; font-weight: 700; margin: 0; letter-spacing: -0.01em; text-wrap: balance; }
.tag { font-size: 11px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: var(--accent); border: 1px solid var(--accent); border-radius: 4px; padding: 2px 6px; }
#sideBtn { display: none; }
nav { display: flex; flex-direction: column; gap: 2px; }
nav .sec { margin: 10px 6px 4px; font-size: 11px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); }
nav .sec:first-child { margin-top: 2px; }
nav a { display: block; text-decoration: none; color: var(--fg); border-radius: 6px; padding: 7px 10px; font-size: 13.5px; line-height: 1.3; border-left: 3px solid transparent; }
nav a:hover { background: var(--hover); }
nav a[aria-current="page"] { background: var(--total); border-left-color: var(--accent); font-weight: 600; }
details.off { color: var(--muted); font-size: 12.5px; border-top: 1px solid var(--line); padding: 10px 6px 0; }
details.off summary { cursor: pointer; }
details.off ul { margin: 8px 0 0; padding-left: 16px; display: grid; gap: 6px; }
@media (max-width: 960px) {
  .shell { grid-template-columns: minmax(0, 1fr); gap: 12px; }
  .side { position: static; max-height: none; padding: 10px; }
  #sideBtn { display: inline-flex; justify-content: space-between; align-items: center; width: 100%; }
  .side .menuwrap { display: none; }
  .side.open .menuwrap { display: flex; flex-direction: column; gap: 12px; }
}
@media (min-width: 961px) { .side .menuwrap { display: flex; flex-direction: column; gap: 12px; } }
.pagehead h2 { margin: 0; font-size: 18px; font-weight: 700; }
.pagehead .meta { color: var(--muted); font-size: 13px; }

.hr { display: flex; align-items: center; gap: 10px; }
.aib { display: inline-flex; align-items: center; gap: 6px; }
.aib .ic { margin: 0; }
.aip { position: fixed; top: 0; right: 0; bottom: 0; width: min(420px, 100vw); background: var(--surface); border-left: 1px solid var(--line); box-shadow: -8px 0 28px rgba(0, 0, 0, 0.16); z-index: 40; display: flex; flex-direction: column; }
.aip[hidden] { display: none; }
.aip .ah { display: flex; align-items: center; gap: 8px; padding: 12px 14px; border-bottom: 1px solid var(--line); }
.aip .ah h3 { margin: 0; font-size: 15px; flex: 1; }
.aip .ah .btn { padding: 5px 8px; font-size: 12.5px; }
.aip .ah .btn .ic { margin: 0; }
.aip .as { padding: 8px 14px 0; font-size: 12px; color: var(--muted); }
.aip .am { flex: 1; overflow-y: auto; padding: 12px 14px; display: flex; flex-direction: column; gap: 10px; }
.aip .msg { max-width: 92%; padding: 9px 12px; border-radius: 10px; font-size: 13.5px; line-height: 1.5; overflow-wrap: anywhere; }
.aip .msg.u { align-self: flex-end; background: var(--accent); color: var(--accent-ink); }
.aip .msg.a { align-self: flex-start; background: var(--head); }
.aip .msg p { margin: 0 0 6px; } .aip .msg p:last-child { margin: 0; }
.aip .msg ul { margin: 4px 0 6px; padding-left: 18px; }
.aip .msg .st { color: var(--muted); font-size: 12.5px; }
.aip .chips { display: flex; flex-wrap: wrap; gap: 6px; padding: 0 14px 8px; }
.aip .chips button { font: inherit; font-size: 12.5px; background: var(--surface); color: var(--fg); border: 1px solid var(--line); border-radius: 999px; padding: 4px 10px; cursor: pointer; text-align: left; }
.aip .chips button:hover { background: var(--hover); }
.aip form { display: flex; gap: 8px; padding: 10px 14px 14px; border-top: 1px solid var(--line); }
.aip textarea { flex: 1; font: inherit; font-size: 14px; resize: none; height: 40px; max-height: 120px; padding: 8px 10px; border: 1px solid var(--line); border-radius: 6px; background: var(--surface); color: var(--fg); }
.aip form .btn { align-self: flex-end; height: 40px; }
.pagehead { position: relative; }
.ttl { display: flex; align-items: center; gap: 8px; }
.infob { display: inline-flex; align-items: center; justify-content: center; width: 28px; height: 28px; padding: 0; border-radius: 50%; border: 1px solid var(--line); background: var(--surface); color: var(--muted); cursor: pointer; flex: 0 0 auto; }
.infob:hover, .infob[aria-expanded="true"] { color: var(--accent); border-color: var(--accent); }
.infob .ic { margin: 0; }
.infop { position: absolute; left: 0; top: calc(100% + 6px); width: min(560px, 86vw); background: var(--surface); border: 1px solid var(--line); border-radius: 8px; box-shadow: 0 8px 24px rgba(0, 0, 0, 0.18); padding: 12px 14px; z-index: 30; }
.infop[hidden] { display: none; }
.infop .note { margin-top: 8px; }
.note { background: var(--head); border-radius: 6px; padding: 6px 10px; font-size: 13px; color: var(--muted); margin-top: 6px; max-width: 110ch; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; }
label, .lbl { display: flex; flex-direction: column; gap: 4px; font-size: 11px; font-weight: 600; letter-spacing: 0.05em; text-transform: uppercase; color: var(--muted); min-width: 0; }
select, input[type="search"] {
  font: inherit; font-size: 14px; text-transform: none; letter-spacing: 0; font-weight: 400; color: var(--fg);
  background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 7px 8px; min-width: 0;
}
select:focus-visible, button:focus-visible, input:focus-visible, summary:focus-visible, nav a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
.seg button { font: inherit; font-size: 13px; background: var(--surface); color: var(--fg); border: 0; padding: 7px 12px; cursor: pointer; }
.seg button + button { border-left: 1px solid var(--line); }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); font-weight: 600; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { font: inherit; font-size: 13px; background: var(--surface); color: var(--fg); border: 1px solid var(--line); border-radius: 999px; padding: 4px 11px; cursor: pointer; }
.chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 600; }
.btn { font: inherit; font-size: 13px; font-weight: 600; background: var(--surface); color: var(--fg); border: 1px solid var(--line); border-radius: 6px; padding: 7px 12px; cursor: pointer; white-space: nowrap; }
.btn:hover { background: var(--hover); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.primary:hover { filter: brightness(1.08); }
.toolbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.toolbar .grow { flex: 1 1 200px; color: var(--muted); font-size: 13px; min-width: 0; }
.toolbar select { width: 190px; }
.menu { position: relative; }
.menu > summary { list-style: none; cursor: pointer; }
.menu > summary::-webkit-details-marker { display: none; }
.menu .pop { position: absolute; right: 0; top: calc(100% + 4px); background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 6px; display: grid; gap: 2px; min-width: 210px; z-index: 15; box-shadow: 0 6px 20px rgba(0, 0, 0, 0.15); }
.menu .pop button { font: inherit; font-size: 13px; text-align: left; background: none; border: 0; color: var(--fg); padding: 8px 10px; border-radius: 6px; cursor: pointer; }
.menu .pop button:hover { background: var(--hover); }

/* the analysis table */
.grid { overflow: auto; max-height: 74vh; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); }
table { border-collapse: separate; border-spacing: 0; font-variant-numeric: tabular-nums; }
th, td { padding: 0 9px; height: 30px; text-align: right; white-space: nowrap; border-bottom: 1px solid var(--line); border-right: 1px solid var(--line); }
thead th { position: sticky; background: var(--head); font-size: 12px; font-weight: 600; z-index: 3; text-align: center; }
thead tr.r1 th { top: 0; background: var(--head2); }
thead tr.r2 th { top: 30px; }
thead tr.r3 th { top: 60px; font-weight: 500; color: var(--muted); }
th.rs { top: 0; height: 60px; background: var(--head2); }
th.gh { max-width: 360px; }
th.c1, td.c1 { position: sticky; left: 0; width: 250px; min-width: 250px; max-width: 250px; text-align: left; z-index: 2; background: var(--surface); overflow: hidden; text-overflow: ellipsis; }
th.c2, td.c2 { position: sticky; left: 250px; width: 76px; min-width: 76px; z-index: 2; background: var(--surface); border-right: 2px solid var(--line); }
thead th.c1, thead th.c2 { z-index: 5; background: var(--head2); top: 0; height: 90px; vertical-align: bottom; text-align: left; padding-bottom: 8px; }
thead th.c2 { text-align: right; }
tr.total td { background: var(--total); font-weight: 700; }
tr.sect td { background: var(--head); text-align: left; font-size: 11px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); height: 24px; }
tr.sect td.c1, tr.sect td.c2 { background: var(--head); }
tr.data:hover td { background: var(--hover); }
tr.total:hover td { background: var(--total); }
td.wk { min-width: 46px; }
.lab { display: inline-flex; align-items: center; gap: 4px; }
.tog { font: inherit; width: 20px; height: 20px; line-height: 1; border: 1px solid var(--line); background: var(--surface); color: var(--fg); border-radius: 4px; cursor: pointer; padding: 0; font-size: 13px; }
.sp { display: inline-block; width: 20px; }
.l2 .lab { padding-left: 18px; } .l3 .lab { padding-left: 36px; }
.l3 .lab span:last-child { color: var(--muted); }
.x { font: inherit; border: 0; background: none; color: var(--muted); cursor: pointer; padding: 0 0 0 6px; font-size: 14px; line-height: 1; }
.x:hover { color: var(--fg); }
.how { color: var(--muted); font-size: 13px; display: grid; gap: 4px; }
.how p { margin: 0; max-width: 90ch; }
.empty { color: var(--muted); padding: 28px; text-align: center; border: 1px dashed var(--line); border-radius: 8px; }
#toast { position: fixed; bottom: calc(16px + env(safe-area-inset-bottom, 0px)); left: 50%; transform: translateX(-50%); background: var(--fg); color: var(--bg); padding: 8px 14px; border-radius: 6px; font-size: 13px; z-index: 60; }

/* indicator drawer */
.drawer { position: fixed; inset: 0; z-index: 40; display: flex; justify-content: flex-end; }
.drawer[hidden] { display: none; }
.scrim { position: absolute; inset: 0; background: var(--scrim); }
.dpanel { position: relative; width: min(460px, 100vw); height: 100%; background: var(--surface); border-left: 1px solid var(--line); display: flex; flex-direction: column; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); padding-right: env(safe-area-inset-right, 0px); }
.dhead { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 14px 16px 6px; }
.dhead h3 { margin: 0; font-size: 16px; }
.dcount { color: var(--muted); font-size: 13px; padding: 0 16px; }
.dtools { display: flex; flex-wrap: wrap; gap: 8px; padding: 10px 16px; }
.dtools input { flex: 1 1 100%; width: 100%; }
.dlist { flex: 1; overflow: auto; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); }
.dg { border-bottom: 1px solid var(--line); }
.dgh { display: flex; align-items: center; gap: 10px; padding: 8px 16px; }
.dgn { flex: 1; display: flex; align-items: center; gap: 8px; font: inherit; font-size: 14px; font-weight: 600; text-align: left; background: none; border: 0; color: var(--fg); cursor: pointer; padding: 2px 0; min-width: 0; }
.dgn .car { width: 14px; color: var(--muted); flex: 0 0 auto; }
.dgn .nm { overflow-wrap: anywhere; }
.cnt { color: var(--muted); font-size: 12px; flex: 0 0 auto; }
.dgo { padding: 0 16px 10px 40px; display: grid; gap: 2px; }
.dgo label { flex-direction: row; align-items: center; gap: 10px; font-size: 13px; letter-spacing: 0; text-transform: none; font-weight: 400; color: var(--fg); padding: 3px 0; }
input[type="checkbox"] { accent-color: var(--accent); width: 17px; height: 17px; margin: 0; flex: 0 0 auto; }
.dfoot { padding: 12px 16px; display: flex; justify-content: flex-end; }
@media (prefers-reduced-motion: no-preference) { .btn, .chip, .tog, nav a { transition: background 0.12s; } }

/* icons, sidebar accordion, detail control, empty-cell codes */
.ic { width: 16px; height: 16px; flex: none; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; vertical-align: -3px; }
.btn .ic, summary.btn .ic { margin-right: 6px; }
.navq { position: relative; padding: 0 2px; }
.navq .ic { position: absolute; left: 12px; top: 10px; color: var(--muted); }
.navq input { width: 100%; padding-left: 32px; }
nav { gap: 4px; }
.ns { display: flex; flex-direction: column; }
nav .sec { display: flex; align-items: center; gap: 9px; width: 100%; margin: 0; padding: 9px 10px; font: inherit; font-size: 13.5px; font-weight: 700; letter-spacing: 0; text-transform: none; color: var(--fg); background: none; border: 0; border-radius: 6px; cursor: pointer; text-align: left; }
nav .sec:hover { background: var(--hover); }
nav .sec .sn { flex: 1; }
nav .sec .cnt { font-size: 11.5px; font-weight: 600; color: var(--muted); background: var(--head); border-radius: 999px; padding: 1px 8px; }
nav .sec .chev { transition: transform 0.15s; color: var(--muted); }
nav .sec[aria-expanded="true"] .chev { transform: rotate(90deg); }
nav .sec.cur { color: var(--accent); }
nav .items { display: flex; flex-direction: column; gap: 1px; margin: 2px 0 6px 18px; padding-left: 8px; border-left: 2px solid var(--line); }
nav .items[hidden], .ns[hidden], nav a[hidden] { display: none; }
nav .items a { padding: 6px 9px; font-size: 13px; }
.tb .find { position: relative; }
.tb .find .ic { position: absolute; left: 9px; top: 9px; color: var(--muted); }
.tb .find input { width: 210px; padding: 7px 8px 7px 30px; font-size: 13px; }
.seg button .ic { margin-right: 5px; }
.dlab { display: inline-flex; align-items: center; gap: 8px; font-size: 11px; font-weight: 600; letter-spacing: 0.05em; text-transform: uppercase; color: var(--muted); }
.legend { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 16px; font-size: 12.5px; color: var(--muted); }
.legend .code, td.nr .cd { font-weight: 700; font-size: 11px; letter-spacing: 0.04em; border-radius: 4px; padding: 1px 5px; background: var(--head); color: var(--muted); }
td.nr { color: var(--muted); opacity: 1; font-size: 11px; font-weight: 700; letter-spacing: 0.04em; text-align: center; }
td.nr.nv { background: color-mix(in srgb, var(--muted) 10%, transparent); }
td.nr.nq { background: repeating-linear-gradient(135deg, transparent 0 5px, color-mix(in srgb, var(--muted) 14%, transparent) 5px 7px); }
.l3 .ty { font-size: 10.5px; font-weight: 700; letter-spacing: 0.04em; color: var(--muted); border: 1px solid var(--line); border-radius: 4px; padding: 0 4px; margin-left: 6px; }

/* tidy top, collapsible panel, multi-select dropdowns */
.shell.collapsed { grid-template-columns: minmax(0, 1fr); }
.shell.collapsed .side { display: none; }
.main > header { align-items: flex-start; }
.hl { display: flex; gap: 12px; align-items: flex-start; min-width: 0; }
.hl .btn { padding: 7px 9px; margin-top: 1px; }
.hl .btn .ic { margin: 0; }
.brand { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }
.brand .btn { padding: 5px 7px; }
.brand .btn .ic { margin: 0; }
@media (max-width: 960px) { #navToggle, .brand .btn { display: none; } }
.panel { display: grid; grid-template-columns: repeat(auto-fit, minmax(135px, 1fr)); gap: 12px 14px; align-items: end; }
.panel .seg button { white-space: nowrap; padding: 7px 8px; }
.panel .seg { height: 35px; }
.panel select, .panel .msb { width: 100%; }
.panel .seg { align-self: stretch; }
.panel .seg button { flex: 1; }
.msb { font: inherit; font-size: 14px; text-transform: none; letter-spacing: 0; font-weight: 400; color: var(--fg); background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 7px 8px; display: flex; align-items: center; gap: 6px; cursor: pointer; text-align: left; }
.msb .mst { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.msb .ic { margin: 0; color: var(--muted); }
.ms { position: relative; }
.mspop { position: absolute; left: 0; top: calc(100% + 4px); width: 290px; max-width: 86vw; max-height: 360px; display: flex; flex-direction: column; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; box-shadow: 0 8px 24px rgba(0, 0, 0, 0.18); z-index: 25; text-transform: none; letter-spacing: 0; }
.mspop[hidden] { display: none; }
.mspop .msq { margin: 8px 8px 4px; width: calc(100% - 16px); }
.msact { display: flex; gap: 6px; padding: 4px 8px 8px; border-bottom: 1px solid var(--line); }
.msact button { font: inherit; font-size: 12.5px; background: none; border: 1px solid var(--line); border-radius: 6px; padding: 3px 9px; cursor: pointer; color: var(--fg); }
.msact button:hover { background: var(--hover); }
.msl { overflow: auto; padding: 4px 0; }
.msl label { flex-direction: row; align-items: center; gap: 8px; padding: 5px 12px; font-size: 13px; font-weight: 400; letter-spacing: 0; text-transform: none; color: var(--fg); cursor: pointer; }
.msl label:hover { background: var(--hover); }
.msl label .nm { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.msl label .n { color: var(--muted); font-size: 12px; }
.msl .msg { padding: 8px 12px 2px; font-size: 11px; font-weight: 700; letter-spacing: 0.05em; text-transform: uppercase; color: var(--muted); }
.msl .none { padding: 12px; color: var(--muted); font-size: 13px; }
.tb { display: flex; flex-wrap: wrap; gap: 10px 14px; align-items: center; justify-content: space-between; }
.tbg { display: flex; flex-wrap: wrap; gap: 8px 10px; align-items: center; }
.tbg select { width: 190px; }
.tb .btn, .tb summary.btn, .tbg select, .tb .find input { height: 36px; box-sizing: border-box; display: inline-flex; align-items: center; }
.tb .find input { display: block; }
.tb .find .ic { top: 10px; }
.tbg select { display: block; }
.tb { justify-content: flex-start; }
.tb .menu { margin-left: auto; }
.tb2 { display: flex; align-items: center; gap: 10px; }
.tb2 .dlab { gap: 12px; }
.toolsd { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; }
.toolsd > summary { list-style: none; cursor: pointer; display: flex; align-items: center; gap: 8px; padding: 9px 14px; font-size: 13.5px; font-weight: 700; }
.toolsd > summary::-webkit-details-marker { display: none; }
.toolsd > summary .th { flex: 1; font-weight: 400; font-size: 12.5px; color: var(--muted); }
.toolsd > summary .ic:last-child { color: var(--muted); transform: rotate(90deg); transition: transform 0.15s; }
.toolsd[open] > summary .ic:last-child { transform: rotate(-90deg); }
.toolsd[open] > summary { border-bottom: 1px solid var(--line); }
.toolsd .panel.tools { border: 0; box-shadow: none; background: none; }
.panel.tools { display: flex; flex-wrap: wrap; gap: 14px 20px; align-items: flex-end; }
.panel.tools .trow { display: flex; gap: 8px; }
.panel.tools .trow select { width: 180px; }

/* Hosted version: window.LS_API = '/api' is set by the host page. Without it the page reads data/*.json. */
let API = window.LS_API || null;
async function loadPage(id) {

/* ---------- boot and routing ---------- */

/* ---- Ask AI: answers from the data on the open page ---- */
let AIS = null, AIH = [], AICtl = null, AIBusy = false;
const AIRULES = 'You answer questions about one table from a health facility study in Kaduna State, Nigeria. Rules: (1) Get every number from the tools. Never guess and never use memory. (2) If the data cannot answer, say so. (3) An empty value means no answer was recorded. It is not zero. (4) For Yes/No columns the value is the number of facilities that answered Yes. For a percent, divide by the facilities in that group and say so. (5) Say which weeks and filters you used. (6) PHC means primary health centre. HC means health clinic. (7) Write short, plain sentences. Use short lists, no tables, no em dashes. Give the key number first.';
function aiCols() { return P.cols.map((c, k) => ({ id: k, indicator: c.g, option: c.o || '', type: c.k === 'b' ? 'Yes count' : 'number (summed)', round1_only: c.p === 'r' || undefined })); }
function aiPageInfo() {
  return { page: (MAN.pages.find(p => p.id === S.id) || {}).title, weeks: P.weeks, columns: aiCols(), facilities: F.length, lgas: LGAS,
    view_filters: { state: S.state, area: S.area, type: S.type, lgas_excluded: [...S.lgaOff], weeks: P.weeks.length ? P.weeks[S.w0] + ' to ' + P.weeks[S.w1] : 'Round 1', facilities_in_view: selected().length, columns_shown: [...S.checked].sort((a, b) => a - b) } };
}
function aiQuery(inp) {
  inp = inp || {};
  const ks = (inp.columns || []).map(Number).filter(k => P.cols[k]);
  if (!ks.length) return { error: 'Give valid column ids from page_info.' };
  if (ks.length > 12) return { error: 'At most 12 columns per call. Split the request.' };
  const nw = P.weeks.length;
  let wis = (inp.weeks && inp.weeks.length) ? inp.weeks.map(w => P.weeks.indexOf(String(w))).filter(i => i >= 0) : (nw ? P.weeks.map((_, i) => i) : [0]);
  if (!wis.length) wis = nw ? P.weeks.map((_, i) => i) : [0];
  const low = v => (Array.isArray(v) ? v : (v == null ? [] : [v])).map(x => String(x).toLowerCase());
  const fl = { lga: low(inp.lga), ward: low(inp.ward), type: low(inp.type), area: low(inp.area), state: low(inp.state) };
  let base = inp.apply_view_filters ? selected() : F.map((_, i) => i);
  base = base.filter(i => { const f = F[i];
    return (!fl.lga.length || fl.lga.includes(f.lga.toLowerCase())) && (!fl.ward.length || fl.ward.includes(f.ward.toLowerCase())) && (!fl.type.length || fl.type.includes(f.type.toLowerCase())) && (!fl.area.length || fl.area.includes(f.area.toLowerCase())) && (!fl.state.length || fl.state.includes((f.state || 'Kaduna').toLowerCase())); });
  const by = inp.group_by || 'none', gm = new Map();
  base.forEach(i => { const f = F[i]; const key = by === 'lga' ? f.lga : by === 'ward' ? f.lga + ' / ' + f.ward : by === 'type' ? f.type : by === 'area' ? f.area : by === 'facility' ? f.name + ' (' + f.lga + ', ' + f.type + ')' : 'All'; if (!gm.has(key)) gm.set(key, []); gm.get(key).push(i); });
  const nG = gm.size;
  if (nG > 60 || nG * ks.length * wis.length > 2500) return { error: 'Too much data (' + nG + ' groups, ' + ks.length + ' columns, ' + wis.length + ' weeks). Narrow the weeks, columns or filters, or group more coarsely.' };
  const groups = [...gm.entries()].map(([g, facs]) => { const data = {};
    ks.forEach(k => { const per = P.cols[k].p === 'r' ? [0] : wis; const cs = per.map(wi => cell(facs, wi, k)); data[k] = { weeks: P.cols[k].p === 'r' ? ['Round 1'] : per.map(wi => P.weeks[wi]), value: cs.map(c => c.ans ? Math.round(c.s * 10) / 10 : null), answered: cs.map(c => c.ans) }; });
    return { group: g, facilities: facs.length, data }; });

function aiTools() {
  return [
    { name: 'page_info', description: 'Describes the open page: its columns (id, indicator, option), its weeks, and the filters the user currently has on screen. Call this first.', inputSchema: { type: 'object', properties: {} },
      async execute() { aiStatus('Reading the page layout...'); return aiPageInfo(); } },
    { name: 'query', description: 'Counts (Yes columns) or sums (number columns) per group and week from the open page. Values are null when no answer was recorded. Each value has an "answered" count next to it.',
      inputSchema: { type: 'object', properties: {
        columns: { type: 'array', items: { type: 'integer' }, description: 'Column ids from page_info (max 12).' },
        weeks: { type: 'array', items: { type: 'string' }, description: 'Week labels such as WK10. Leave out for all weeks.' },

async function aiAsk(q) {

async function initAI() {

  document.body.insertAdjacentHTML('beforeend', '<aside class="aip" id="aiP" hidden aria-label="Ask AI"><div class="ah"><h3>Ask AI</h3><button type="button" class="btn" id="aiClr" title="Start a new chat">New chat</button><button type="button" class="btn" id="aiX" aria-label="Close"></button></div><div class="as" id="aiSub"></div><div class="am" id="aiMsg" aria-live="polite"></div><div class="chips" id="aiChips"></div><form id="aiF"><textarea id="aiIn" rows="1" placeholder="Ask about this page" aria-label="Question"></textarea><button type="submit" class="btn primary" id="aiSend">Ask</button></form></aside>');

  $('aiIn').onkeydown = e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); if (!AIBusy) aiAsk($('aiIn').value); } };

(async function boot() {

      } catch (err) {

        API = null;
        [fac, man] = await Promise.all([getJSON('data/facilities.json'), getJSON('data/pages.json')]);
      }
    } else {

    }

    LGAS = [...new Set(F.map(f => f.lga))];
    $('sub').textContent = 'Longitudinal Study 2.0 \u00b7 ' + F.length + ' facilities in ' + LGAS.length + ' LGAs';
    SEC = [['building', 'Facility', ['facility-info', 'staff-training', 'cce-biweekly', 'cce-interruption']], ['calendar', 'Service days', ['days-service', 'expected-covered', 'expected-total', 'expected-reasons']], ['users', 'Health workers', ['hw-availability', 'hw-absenteeism', 'absenteeism-reasons', 'perm-absenteeism', 'salary-delay', 'roster']], ['pill', 'SCM: Essential medicines', ['em-available', 'em-observed', 'em-expired', 'em-not-observed', 'em-min-calc', 'em-ms-sb', 'em-stockout', 'em-req-tracker', 'em-req-numbers', 'em-req-reason', 'em-source']], ['syringe', 'SCM: Vaccines', ['vc-available', 'vc-ms-sb', 'vc-observed', 'vc-expired', 'vc-not-observed', 'vc-dispense', 'vc-source']]];
    const seen = new Set(MAN.pages.length ? [] : []);

    $('navqi').innerHTML = ic('search');

/* ---------- numbers ---------- */
const isR = k => P.cols[k].p === 'r';
const title = k => P.cols[k].o ? P.cols[k].g + ' \u00b7 ' + up(P.cols[k].o) : P.cols[k].g;
const pctOn = k => P.cols[k].k === 'b' && S.mode === 'pct';
function selected() {
  const out = [];
  F.forEach((f, i) => { if ((S.state === 'All' || (f.state || 'Kaduna') === S.state) && (S.area === 'All' || f.area === S.area) && (S.type === 'All' || f.type === S.type) && !S.lgaOff.has(f.lga) && !S.wOff.has(f.lga + '|' + f.ward)) out.push(i); });

function cell(facs, wi, k) {
  const c = P.cols[k], bin = c.k === 'b';

    for (const i of facs) { const r = r1Map.get(i); if (!r) continue; rep++; const v = r[1 + k]; if (v == null) continue; ans++; if (bin) { if (v === 1) s++; } else s += v; }
  } else {

}

}
const tyRank = f => f.type === 'PHC' ? 0 : 1;
const lgaRank = l => { const n = LGAS.indexOf(l); return n < 0 ? 99 : n; };
const cmpFac = (a, b) => lgaRank(F[a].lga) - lgaRank(F[b].lga) || tyRank(F[a]) - tyRank(F[b]) || String(F[a].ward).localeCompare(String(F[b].ward)) || F[a].name.localeCompare(F[b].name);
function buildRows(ids) {

  rows.push({ sect: 'Facility type' });

  rows.push({ sect: 'Local Government Area' });

    if (!fl.length) return;

    c.alignment = { wrapText: true, vertical: 'bottom', horizontal: n < 7 ? 'left' : 'center' }; c.border = { right: xb('FFFFFFFF') };
    ws.getColumn(n + 1).width = [16, 20, 10, 34, 26, 8, 9][n] || 14;
  });
  for (let n = 2; n <= aoa.length; n++) {
    const row = ws.getRow(n);
    for (let c = 1; c <= head.length; c++) {
      const x = row.getCell(c); x.font = { size: 10, color: { argb: c <= 7 ? XC.ink : XC.ink } };
      if (c > 7) x.alignment = { horizontal: 'center' };
      x.border = { bottom: xb(XC.line) };
      if (n % 2 === 1) x.fill = xfill(XC.band);
    }
  }
  ws.autoFilter = { from: { row: 1, column: 1 }, to: { row: 1, column: head.length } };
  notesSheet(wb, 'One row per facility and week, with the indicators you ticked. Empty means no answer was recorded.');
  return new Uint8Array(await wb.xlsx.writeBuffer());
}
async function saveXlsx(kind) {
  const aoa = kind === 'grid' ? gridAoa(true) : rawAoa();
  if (aoa.length < 2) { toast('Nothing to download. Tick at least one indicator.'); return; }
  const name = 'LS2_' + S.id + (kind === 'grid' ? '_table' : '_raw_rows');
  if (typeof ExcelJS === 'undefined') { toast('The Excel builder did not load. Use CSV, or reload the page.'); return; }
  let data;
  try { data = kind === 'grid' ? await gridXlsx() : await rawXlsx(); }
  catch (e) { toast('Could not build the Excel file.'); return; }
  await deliver(name + '.xlsx', data, csv(aoa));
}
